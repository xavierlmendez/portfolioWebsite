apiVersion: apps/v1
kind: Deployment
metadata:
  name: xavis-projects-deployment
  labels:
    app: xavis-projects
spec:
  replicas: 1   # see the ledger volume note below; raise only with a ReadWriteMany volume
  # Recreate, not RollingUpdate: the ledger PVC is ReadWriteOnce, so a surge pod
  # scheduled on another node stays Pending with a Multi-Attach error and the
  # rollout never completes. Recreate stops the old pod first, at the cost of a
  # few seconds of downtime on each deploy.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: xavis-projects
  template:
    metadata:
      labels:
        app: xavis-projects
    spec:
      # The image runs as uid 1001 (USER nextjs). A freshly provisioned EBS volume
      # mounts root:root 0755, so without fsGroup every append to the ledger fails
      # with EACCES and every signature returns 500. fsGroup makes the kubelet
      # chgrp/chmod the volume to gid 1001 before the container starts.
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: xavis-projects-container
        image: 705558108816.dkr.ecr.us-east-1.amazonaws.com/simple-docker-service-0afffee27add:latest
        ports:
        - containerPort: 3000
        env:
        - name: COURSE_LEDGER_NONCE
          valueFrom:
            secretKeyRef:
              name: course-ledger
              key: nonce
        - name: COURSE_LEDGER_PATH
          value: /ledger/course-ledger.tsv
        volumeMounts:
        - name: course-ledger
          mountPath: /ledger
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        imagePullPolicy: Always
      imagePullSecrets:
      - name: ecr-secret
      volumes:
      - name: course-ledger
        persistentVolumeClaim:
          claimName: course-ledger-pvc
---
# The ledger is an append-only file. With replicas: 2 and no shared volume, each pod
# would keep its own file and entries would split between them. Either run replicas: 1
# with this ReadWriteOnce claim, or use a ReadWriteMany storage class (e.g. EFS) for
# two replicas. Create the nonce secret first:
#   kubectl create secret generic course-ledger --from-literal=nonce=<NONCE>
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: course-ledger-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: xavis-projects-service
spec:
  selector:
    app: xavis-projects
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
  type: LoadBalancer
